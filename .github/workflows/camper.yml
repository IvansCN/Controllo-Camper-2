name: Controllo camper usati

on:
  schedule:
    - cron: "0 7 */3 * *"   # ogni 3 giorni alle 07:00 UTC (08:00/09:00 in Italia)
  workflow_dispatch:         # permette di lanciarlo a mano dal tab Actions

permissions:
  contents: write            # serve per salvare visti.json nel repository

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Controlla annunci
        env:
          MAX_PRICE: "30000"
          CHANNEL: "whatsapp"            # oppure "telegram"
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python controlla_camper.py

      - name: Salva annunci già visti
        run: |
          if [ -n "$(git status --porcelain visti.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add visti.json
            git commit -m "Aggiorna annunci visti"
            git push
          fi
